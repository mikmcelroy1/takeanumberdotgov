# Cloudflare Worker settings. The Worker in src/index.js answers /api/scores; the files in
# public/ are the website. "name" must match the Worker's name in the Cloudflare dashboard.
name = "takeanumber"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Cloudflare creates the DNS records and https certificates for these addresses on deploy.
routes = [
  { pattern = "takeanumberdotgov.com", custom_domain = true },
  { pattern = "www.takeanumberdotgov.com", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
# Run src/index.js before serving any file, so www visitors get redirected even for the home page.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "takeanumber-scores"
database_id = "88a8a0b5-a371-4814-9dce-33fd3b5991d7"
